<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -45 290 330" width="290" height="330" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="furDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b4b4e"/>
      <stop offset="1" stop-color="#1b1b1d"/>
    </linearGradient>
    <linearGradient id="furWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece9e0"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcfdc"/>
      <stop offset="1" stop-color="#ff9db3"/>
    </linearGradient>
    <linearGradient id="tanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6c9"/>
      <stop offset="1" stop-color="#eeb989"/>
    </linearGradient>
    <radialGradient id="pupilGrad" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#5b5b5b"/>
      <stop offset="0.55" stop-color="#211f1f"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>

  <g stroke="#1a1a1a" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">

    <!-- sombra de piso -->
    <ellipse cx="120" cy="247" rx="72" ry="11" fill="#000" opacity=".14" stroke="none"/>

    <!-- piernas -->
    <ellipse cx="66" cy="213" rx="33" ry="27" fill="url(#furDark)"/>
    <ellipse cx="174" cy="213" rx="33" ry="27" fill="url(#furDark)"/>
    <ellipse cx="60" cy="221" rx="19" ry="13.5" fill="url(#tanGrad)"/>
    <ellipse cx="180" cy="221" rx="19" ry="13.5" fill="url(#tanGrad)"/>
    <g stroke-width="2">
      <circle cx="50" cy="215" r="4.6" fill="url(#tanGrad)"/>
      <circle cx="60" cy="211" r="4.6" fill="url(#tanGrad)"/>
      <circle cx="70" cy="215" r="4.6" fill="url(#tanGrad)"/>
      <circle cx="190" cy="215" r="4.6" fill="url(#tanGrad)"/>
      <circle cx="180" cy="211" r="4.6" fill="url(#tanGrad)"/>
      <circle cx="170" cy="215" r="4.6" fill="url(#tanGrad)"/>
    </g>

    <!-- brazo derecho (abajo, apoyado) -->
    <ellipse cx="198" cy="170" rx="22" ry="33" fill="url(#furDark)" transform="rotate(18 198 170)"/>
    <ellipse cx="202" cy="193" rx="14" ry="10" fill="url(#tanGrad)" transform="rotate(12 202 193)"/>

    <!-- cuerpo (blanco/crema, sin anillo negro) -->
    <ellipse cx="120" cy="182" rx="74" ry="62" fill="url(#furWhite)"/>

    <!-- brazo izquierdo levantado, saludando (animado: pivotea en el hombro) -->
    <g transform="translate(82,156)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8;12;-8" dur="0.85s" repeatCount="indefinite"/>
        <g transform="translate(-82,-156)">
          <ellipse cx="46" cy="128" rx="21" ry="46" fill="url(#furDark)" transform="rotate(-52 46 128)"/>
          <circle cx="18" cy="58" r="17" fill="url(#furDark)"/>
          <ellipse cx="16" cy="60" rx="10" ry="8" fill="url(#tanGrad)" stroke-width="2"/>
        </g>
      </g>
    </g>
    <!-- lineas de movimiento del saludo (parpadean junto con el vaiven) -->
    <g stroke="#1a1a1a" stroke-width="3" fill="none">
      <path d="M-10 30 Q-16 40 -10 50" opacity="0">
        <animate attributeName="opacity" values="0;0;.65;0;0" keyTimes="0;.15;.4;.6;1" dur="0.85s" repeatCount="indefinite"/>
      </path>
      <path d="M-1 20 Q-9 34 -1 48" opacity="0">
        <animate attributeName="opacity" values="0;0;.65;0;0" keyTimes="0;.25;.5;.7;1" dur="0.85s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- orejas -->
    <circle cx="62" cy="50" r="31" fill="url(#furDark)"/>
    <circle cx="178" cy="50" r="31" fill="url(#furDark)"/>
    <circle cx="62" cy="52" r="15.5" fill="url(#pinkGrad)" stroke-width="2.2"/>
    <circle cx="178" cy="52" r="15.5" fill="url(#pinkGrad)" stroke-width="2.2"/>

    <!-- cabeza -->
    <circle cx="120" cy="112" r="82" fill="url(#furWhite)"/>

    <!-- manchas de los ojos (mas grandes, mas "panda") -->
    <ellipse cx="80" cy="108" rx="31" ry="40" fill="url(#furDark)" transform="rotate(-14 80 108)"/>
    <ellipse cx="160" cy="108" rx="31" ry="40" fill="url(#furDark)" transform="rotate(14 160 108)"/>

    <!-- cachetes -->
    <ellipse cx="74" cy="144" rx="15" ry="9.5" fill="url(#pinkGrad)" opacity=".9" stroke="none"/>
    <ellipse cx="166" cy="144" rx="15" ry="9.5" fill="url(#pinkGrad)" opacity=".9" stroke="none"/>

    <!-- pestañas -->
    <path d="M58 74 Q50 65 42 64" stroke-width="3.4" fill="none"/>
    <path d="M63 68 Q58 57 52 54" stroke-width="3.4" fill="none"/>
    <path d="M182 74 Q190 65 198 64" stroke-width="3.4" fill="none"/>
    <path d="M177 68 Q182 57 188 54" stroke-width="3.4" fill="none"/>

    <!-- ojos: blanco -->
    <ellipse cx="91" cy="116" rx="18.5" ry="20.5" fill="#fff" stroke-width="2.4"/>
    <ellipse cx="149" cy="116" rx="18.5" ry="20.5" fill="#fff" stroke-width="2.4"/>
  </g>

  <!-- pupilas (sin stroke, brillo aparte) -->
  <circle cx="95" cy="120" r="10" fill="url(#pupilGrad)"/>
  <circle cx="145" cy="120" r="10" fill="url(#pupilGrad)"/>
  <circle cx="90.5" cy="114" r="3.6" fill="#fff"/>
  <circle cx="140.5" cy="114" r="3.6" fill="#fff"/>
  <circle cx="99.5" cy="125" r="1.7" fill="#fff" opacity=".85"/>
  <circle cx="149.5" cy="125" r="1.7" fill="#fff" opacity=".85"/>

  <g stroke="#1a1a1a" stroke-linejoin="round" stroke-linecap="round">
    <!-- nariz -->
    <path d="M110 137 Q110 130 120 130 Q130 130 130 137 Q130 143 120 145 Q110 143 110 137 Z" fill="#211f1f" stroke-width="2"/>
    <circle cx="115.5" cy="134.5" r="1.6" fill="#585555" stroke="none"/>

    <!-- boca (sonrisa tipo "gato/oso": dos curvas que bajan y suben) -->
    <path d="M120 145 C 114 153 105 154 97 148" stroke-width="3.2" fill="none"/>
    <path d="M120 145 C 126 153 135 154 143 148" stroke-width="3.2" fill="none"/>
  </g>
  <path d="M110 149 Q120 163 130 149 Q120 156 110 149 Z" fill="#ff9db3" stroke="none"/>
</svg>
